run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - errcheck
    - gosec
    - gocritic
    - revive

linters-settings:
  gosec:
    excludes:
      - G204 # subprocess launched with variable — pki tool may shell out, handled manually
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - revive
