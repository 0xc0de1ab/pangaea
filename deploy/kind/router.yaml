apiVersion: v1
kind: Namespace
metadata:
  name: pangaea-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangaea-router
  namespace: pangaea-e2e
  labels:
    app.kubernetes.io/name: pangaea-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pangaea-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangaea-router
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-router-state
          image: alpine:3.22
          command:
            - sh
            - -c
            - mkdir -p /var/lib/pangaea/router && chown -R 1000:1000 /var/lib/pangaea/router && chmod 0700 /var/lib/pangaea/router
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: router-state
              mountPath: /var/lib/pangaea/router
      containers:
        - name: router
          image: pangaea/router:kind
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - router
            - serve
            - --listen=0.0.0.0:8080
            - --policy=/etc/pangaea/router-policy.yaml
            - --api-key=$(PANGAEA_ROUTER_API_KEY)
            - --peer-token=$(PANGAEA_ROUTER_PEER_TOKEN)
            - --stream-token-key=$(PANGAEA_STREAM_TOKEN_KEY)
            - --tenant-id=kind
            - --user-id=e2e
            - --state-dir=/var/lib/pangaea/router
            - --state-mode=$(PANGAEA_ROUTER_STATE_MODE)
            - --data-request-timeout=$(PANGAEA_ROUTER_DATA_REQUEST_TIMEOUT)
          env:
            - name: PANGAEA_ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: api-key
            - name: PANGAEA_ROUTER_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: peer-token
            - name: PANGAEA_STREAM_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: stream-token-key
            - name: PANGAEA_ROUTER_STATE_MODE
              value: persistent
            - name: PANGAEA_ROUTER_DATA_REQUEST_TIMEOUT
              value: 10m
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: router-policy
              mountPath: /etc/pangaea
              readOnly: true
            - name: router-state
              mountPath: /var/lib/pangaea/router
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
      volumes:
        - name: router-policy
          configMap:
            name: pangaea-router-policy
        - name: router-state
          hostPath:
            path: /var/lib/pangaea/pangaea-router
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pangaea-router
  namespace: pangaea-e2e
  labels:
    app.kubernetes.io/name: pangaea-router
spec:
  selector:
    app.kubernetes.io/name: pangaea-router
  ports:
    - name: http
      port: 8080
      targetPort: http
