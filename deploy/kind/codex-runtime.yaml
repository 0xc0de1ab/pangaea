apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangaea-codex-runtime
  namespace: pangaea-e2e
  labels:
    app.kubernetes.io/name: pangaea-codex-runtime
    app.kubernetes.io/component: provider-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pangaea-codex-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangaea-codex-runtime
        app.kubernetes.io/component: provider-runtime
    spec:
      initContainers:
        - name: bootstrap-codex
          image: alpine:3.22
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /var/lib/pangaea/auth/codex /var/lib/pangaea/home/codex /var/lib/pangaea/tmp
              cp /auth-src/auth.json /var/lib/pangaea/auth/codex/auth.json
              chown -R 10001:10001 /var/lib/pangaea
              chmod 0700 /var/lib/pangaea/auth/codex /var/lib/pangaea/home/codex /var/lib/pangaea/tmp
              chmod 0600 /var/lib/pangaea/auth/codex/auth.json
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: codex-auth-secret
              mountPath: /auth-src
              readOnly: true
            - name: codex-state
              mountPath: /var/lib/pangaea
      containers:
        - name: runtime
          image: pangaea/provider-codex:kind
          imagePullPolicy: IfNotPresent
          command:
            - /sbin/tini
            - --
            - codex
          args:
            - app-server
            - --listen
            - ws://127.0.0.1:8080
          env:
            - name: HOME
              value: /var/lib/pangaea/home/codex
            - name: TMPDIR
              value: /var/lib/pangaea/tmp
            - name: CODEX_HOME
              value: /var/lib/pangaea/auth/codex
          ports:
            - name: app
              containerPort: 8080
          volumeMounts:
            - name: codex-state
              mountPath: /var/lib/pangaea
            - name: codex-work
              mountPath: /work
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null http://127.0.0.1:8080/readyz
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null http://127.0.0.1:8080/healthz
            periodSeconds: 10
            failureThreshold: 6
        - name: shim
          image: pangaea/provider-codex:kind
          imagePullPolicy: IfNotPresent
          command:
            - /sbin/tini
            - --
            - sh
            - -c
          args:
            - |
              set -eu
              until wget -q -O /dev/null http://127.0.0.1:8080/readyz; do
                sleep 1
              done
              exec /usr/local/bin/pangaeactl provider-shim run
          env:
            - name: HOME
              value: /var/lib/pangaea/home/codex
            - name: TMPDIR
              value: /var/lib/pangaea/tmp
            - name: CODEX_HOME
              value: /var/lib/pangaea/auth/codex
            - name: PANGAEA_SHIM_MODE
              value: app-server
            - name: PANGAEA_PROVIDER_ID
              value: codex-provider-id
            - name: PANGAEA_PROVIDER_INSTANCE_ID
              value: codex-provider-instance-id
            - name: PANGAEA_NODE_ID
              value: codex-node-id
            - name: PANGAEA_HOST_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PANGAEA_HOST_NAME
              value: "$(PANGAEA_HOST_HOSTNAME)"
            - name: PANGAEA_CONTAINER_KIND
              value: kubernetes
            - name: PANGAEA_CONTAINER_NAME
              value: shim
            - name: PANGAEA_SERVICE
              value: codex
            - name: PANGAEA_ACCOUNT
              value: ""
            - name: PANGAEA_ROUTER_CONTROL_URL
              value: ws://pangaea-router.pangaea-e2e.svc.cluster.local:8080/router/v1/control/ws
            - name: PANGAEA_ROUTER_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: peer-token
            - name: PANGAEA_STREAM_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: stream-token-key
            - name: PANGAEA_AUTH_PATH
              value: /var/lib/pangaea/auth/codex/auth.json
            - name: PANGAEA_AUTH_FORMAT
              value: codex-auth-json-format
            - name: PANGAEA_PROVIDER_MODE
              value: app-server
            - name: PANGAEA_UPSTREAM_BASE_URL
              value: ws://127.0.0.1:8080
            - name: PANGAEA_UPSTREAM_DIALECT
              value: openai
            - name: PANGAEA_UPSTREAM_READY_TIMEOUT
              value: "60"
            - name: PANGAEA_SHIM_PROTOCOLS
              value: openai,anthropic,gemini
            - name: PANGAEA_SHIM_CAPABILITIES
              value: api.openai.chat,api.anthropic.messages,api.gemini.generateContent,stream.sse,usage.read,models.read,auth.file,auth.refresh.oneshot
            - name: PANGAEA_MODEL
              value: codex-model-id
            - name: PANGAEA_MODEL_ALIAS
              value: codex-default
            - name: PANGAEA_MODEL_CAPABILITIES
              value: api.openai.chat,api.anthropic.messages,api.gemini.generateContent,stream.sse
            - name: PANGAEA_REFRESH_COMMAND
              value: codex exec --skip-git-repo-check --sandbox read-only --ephemeral --ignore-user-config --color never 'Reply with OK only.'
            - name: PANGAEA_REFRESH_TIMEOUT
              value: 2m
            - name: PANGAEA_REFRESH_THRESHOLD
              value: 5m
            - name: PANGAEA_REFRESH_COOLDOWN
              value: 5m
          volumeMounts:
            - name: codex-state
              mountPath: /var/lib/pangaea
            - name: codex-work
              mountPath: /work
      volumes:
        - name: codex-auth-secret
          secret:
            secretName: pangaea-codex-auth
            defaultMode: 0400
        - name: codex-state
          hostPath:
            path: /var/lib/pangaea/codex-provider-instance-id
            type: DirectoryOrCreate
        - name: codex-work
          emptyDir: {}
