apiVersion: apps/v1
kind: Deployment
metadata:
  name: pangaea-antigravity-runtime
  namespace: pangaea-e2e
  labels:
    app.kubernetes.io/name: pangaea-antigravity-runtime
    app.kubernetes.io/component: provider-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pangaea-antigravity-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pangaea-antigravity-runtime
        app.kubernetes.io/component: provider-runtime
    spec:
      initContainers:
        - name: bootstrap-antigravity
          image: alpine:3.22
          command:
            - sh
            - -c
            - |
              set -eu
              state_dir=/var/lib/antigravity/state/User/globalStorage
              mkdir -p "${state_dir}"
              if [ -s /auth-src/state.vscdb ]; then
                cp /auth-src/state.vscdb "${state_dir}/state.vscdb"
                chmod 0600 "${state_dir}/state.vscdb"
              fi
              chown -R 10001:10001 /var/lib/antigravity/state
              chmod 0700 /var/lib/antigravity/state "${state_dir}"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: antigravity-auth-secret
              mountPath: /auth-src
              readOnly: true
            - name: antigravity-state
              mountPath: /var/lib/antigravity/state
      containers:
        - name: runtime
          image: pangaea/antigravity-runtime:kind
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              mkdir -p /var/lib/antigravity/state/User/globalStorage
              exec antigravity-compat-proxy serve \
                --proxy-addr 0.0.0.0:8080 \
                --db-path /var/lib/antigravity/state/User/globalStorage/state.vscdb
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-antigravity-runtime-secrets
                  key: openai-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-antigravity-runtime-secrets
                  key: anthropic-key
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-antigravity-runtime-secrets
                  key: gemini-key
            - name: ANTIGRAVITY_GEMINI_DIR
              value: /root/.antigravity-server
            - name: ANTIGRAVITY_APP_DATA_DIR
              value: data
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: antigravity-state
              mountPath: /var/lib/antigravity/state
            - name: antigravity-state
              mountPath: /root/.antigravity-server/data
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
        - name: shim
          image: pangaea/provider-antigravity-sidecar:kind
          imagePullPolicy: IfNotPresent
          env:
            - name: PANGAEA_SHIM_MODE
              value: sidecar-agent
            - name: PANGAEA_PROVIDER_ID
              value: antigravity-sidecar
            - name: PANGAEA_PROVIDER_INSTANCE_ID
              value: antigravity-sidecar
            - name: PANGAEA_NODE_ID
              value: kind-antigravity
            - name: PANGAEA_HOST_NAME
              value: kind-host
            - name: PANGAEA_SERVICE
              value: antigravity
            - name: PANGAEA_ACCOUNT
              value: antigravity-runtime-local
            - name: PANGAEA_ROUTER_CONTROL_URL
              value: ws://pangaea-router.pangaea-e2e.svc.cluster.local:8080/router/v1/control/ws
            - name: PANGAEA_ROUTER_PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: peer-token
            - name: PANGAEA_STREAM_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-router-secrets
                  key: stream-token-key
            - name: PANGAEA_UPSTREAM_BASE_URL
              value: http://127.0.0.1:8080
            - name: PANGAEA_UPSTREAM_DIALECT
              value: openai
            - name: PANGAEA_AUTH_PATH
              value: /var/lib/antigravity/state/User/globalStorage/state.vscdb
            - name: PANGAEA_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pangaea-antigravity-runtime-secrets
                  key: openai-key
            - name: PANGAEA_SHIM_PROTOCOLS
              value: openai,anthropic,gemini
          volumeMounts:
            - name: antigravity-state
              mountPath: /var/lib/antigravity/state
      volumes:
        - name: antigravity-auth-secret
          secret:
            secretName: pangaea-antigravity-auth
            optional: true
            defaultMode: 0400
        - name: antigravity-state
          hostPath:
            path: /var/lib/pangaea/antigravity-sidecar
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pangaea-antigravity-runtime
  namespace: pangaea-e2e
  labels:
    app.kubernetes.io/name: pangaea-antigravity-runtime
spec:
  selector:
    app.kubernetes.io/name: pangaea-antigravity-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
