      api_dialects: [openai]
    candidates:
      - provider: gemini-cli
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.openai.chat
      max_queue_depth: 4
  - id: gemini-kind-anthropic
    match:
      models: [gemini-default, gemini-auto, gemini-auto-3, gemini-auto-2.5, gemini-2.5-flash, gemini-2.5-pro, gemini-2.5-flash-lite, auto-gemini-3, auto-gemini-2.5, gemini-3-pro-preview, gemini-3-flash-preview, gemini-3.1-pro-preview, gemini-3.1-flash-lite-preview]
