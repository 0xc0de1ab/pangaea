version: routing-policy/v1

model_aliases:
  codex-default:
    canonical_model: gpt-5.5
  antigravity-default:
    canonical_model: antigravity-default

routes:
  - id: codex-kind-openai
    match:
      models: [codex-default, gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.3-codex-spark, gpt-5.2]
      api_dialects: [openai]
    candidates:
      - provider: codex-cli
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.openai.chat
      max_queue_depth: 4
  - id: codex-kind-anthropic
    match:
      models: [codex-default, gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.3-codex-spark, gpt-5.2]
      api_dialects: [anthropic]
    candidates:
      - provider: codex-cli
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.anthropic.messages
      max_queue_depth: 4
  - id: codex-kind-gemini
    match:
      models: [codex-default, gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.3-codex-spark, gpt-5.2]
      api_dialects: [gemini]
    candidates:
      - provider: codex-cli
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.gemini.generateContent
      max_queue_depth: 4
  - id: antigravity-kind-openai
    match:
      api_dialects: [openai]
    candidates:
      - provider: antigravity-sidecar
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.openai.chat
      max_queue_depth: 4
  - id: antigravity-kind-anthropic
    match:
      api_dialects: [anthropic]
    candidates:
      - provider: antigravity-sidecar
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.anthropic.messages
      max_queue_depth: 4
  - id: antigravity-kind-gemini
    match:
      api_dialects: [gemini]
    candidates:
      - provider: antigravity-sidecar
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.gemini.generateContent
      max_queue_depth: 4
