  - id: antigravity-kind-anthropic
    match:
      api_dialects: [anthropic]
    candidates:
      - provider: antigravity-sidecar
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.anthropic.messages
      max_queue_depth: 4
  - id: antigravity-kind-gemini
    match:
      api_dialects: [gemini]
    candidates:
      - provider: antigravity-sidecar
        weight: 100
    constraints:
      auth_status: [healthy, refresh_soon]
      health_state: [ready]
      required_capabilities:
        - api.gemini.generateContent
