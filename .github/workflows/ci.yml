name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        id: coverage
        shell: bash
        run: |
          go test ./e2e
          pkgs="$(go list ./... | grep -Ev '^github.com/0xc0de1ab/pangaea/(cmd/pangaeactl|e2e)$')"
          go test -covermode=atomic -coverprofile=coverage.out ${pkgs}
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { sub(/%/, "", $3); print $3 }')"
          echo "total=${total}" >> "${GITHUB_OUTPUT}"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-release
            artifact: build/linux-amd64/release/pangaeactl
          - target: linux-arm64-release
            artifact: build/linux-arm64/release/pangaeactl
          - target: darwin-amd64-release
            artifact: build/macos-amd64/release/pangaeactl
          - target: darwin-arm64-release
            artifact: build/macos-arm64/release/pangaeactl
          - target: windows-amd64-release
            artifact: build/windows-amd64/release/pangaeactl.exe
          - target: windows-arm64-release
            artifact: build/windows-arm64/release/pangaeactl.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.target }}
        shell: bash
        run: make "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate coverage badge
        shell: bash
        run: ./.github/scripts/generate-coverage-badge.sh "${{ needs.test.outputs.coverage }}" ".github/badges/coverage.svg"

      - name: Commit coverage badge
        shell: bash
        run: |
          if git diff --quiet -- .github/badges/coverage.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "ci: update coverage badge [skip ci]"
          git push
