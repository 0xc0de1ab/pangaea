name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{6}\.[0-9]+$ ]]; then
            echo "unsupported release tag format: ${tag}" >&2
            echo "expected: vSEMVER-YYYYMM.seq" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release matrix
        shell: bash
        run: |
          set -euo pipefail
          VERSION_BASE="${TAG_NAME}" make release

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          while read -r os arch artifact; do
            name="pangaeactl_${TAG_NAME}_${os}-${arch}.zip"
            zip -j "dist/${name}" "${artifact}"
          done <<'EOF'
          linux amd64 build/linux-amd64/release/pangaeactl
          linux arm64 build/linux-arm64/release/pangaeactl
          macos amd64 build/macos-amd64/release/pangaeactl
          macos arm64 build/macos-arm64/release/pangaeactl
          windows amd64 build/windows-amd64/release/pangaeactl.exe
          windows arm64 build/windows-arm64/release/pangaeactl.exe
          EOF

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/*.zip --clobber
          else
            gh release create "${TAG_NAME}" dist/*.zip \
              --title "${TAG_NAME}" \
              --generate-notes \
              --verify-tag
          fi
